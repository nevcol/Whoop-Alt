name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Type-check and build
        run: npm run build

      - name: Smoke-test the API boots
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "API is up"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4000/api/health
          curl -sf http://localhost:4000/api/reports/summary > /dev/null
          kill $SERVER_PID

      - name: Test authentication
        run: |
          APP_PASSWORD=test123 npm run start &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          # Verify API is protected
          curl -sf http://localhost:4000/api/settings && exit 1 || true
          # Test login
          curl -sf -X POST http://localhost:4000/api/auth/login -H "Content-Type: application/json" -d '{"password":"test123"}' -c /tmp/cookies.txt > /dev/null
          # Verify access with auth
          curl -sf -b /tmp/cookies.txt http://localhost:4000/api/settings > /dev/null
          kill $SERVER_PID
